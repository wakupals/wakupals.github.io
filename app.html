<style>
:root {
  color-scheme: light dark;
  /* アイコン（ぬいぐるみの茶・オレンジ・ピンク）に合わせた暖かい色 */
  --bg: #fffaf5;
  --surface: #ffffff;
  --ink: #4a3b35;
  --ink-soft: #7e6c65;
  --line: #f1e3da;
  --primary: #ec9bb3;
  --primary-ink: #d86a98;
  --primary-soft: #fdeef2;
  --accent: #f9df98;
  --accent-soft: #fff5dc;
  --accent-ink: #94711c;
  --mint-soft: #e8f5f1;
  --mint-ink: #3d8577;
  --pink-soft: #fde6ec;
  --pink-ink: #d86a98;
  --btn-bg: #4a3b35;
  --btn-ink: #ffffff;
  --shadow: 0 10px 30px rgba(150, 95, 75, 0.12);
  --art-shadow: rgba(150, 95, 75, 0.20);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #211a18;
    --surface: #2c2321;
    --ink: #f5ebe6;
    --ink-soft: #c2b0a9;
    --line: #40332f;
    --primary: #d9839d;
    --primary-ink: #f4abc1;
    --primary-soft: #3a2629;
    --accent: #e8c873;
    --accent-soft: #352c1c;
    --accent-ink: #e8c873;
    --mint-soft: #1f302c;
    --mint-ink: #8fd3c4;
    --pink-soft: #3a2629;
    --pink-ink: #f4abc1;
    --btn-bg: #f5ebe6;
    --btn-ink: #211a18;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --art-shadow: rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--primary-ink); overflow-wrap: anywhere; }
.ic { width: 20px; height: 20px; flex-shrink: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.narrow { max-width: 720px; }

/* ── ヘッダー ── */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 17px; }
.brand img { width: 34px; height: 34px; border-radius: 9px; }
.topbar nav { margin-left: auto; display: flex; gap: 4px; }
.topbar nav a { color: var(--ink-soft); text-decoration: none; font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 10px; white-space: nowrap; }
.topbar nav a:hover { background: var(--primary-soft); color: var(--primary-ink); }
@media (max-width: 560px) { .topbar nav a.opt { display: none; } }

/* ── ボタン ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border-radius: 999px;
  font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.2;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-dark { background: var(--btn-bg); color: var(--btn-ink); box-shadow: var(--shadow); }
.btn-soft { background: var(--primary-soft); color: var(--primary-ink); border: 1px solid var(--primary); }
.btn small { display: block; font-size: 11px; font-weight: 600; opacity: .8; }

/* ── ヒーロー ── */
.hero {
  background:
    radial-gradient(60% 70% at 85% 20%, var(--pink-soft), transparent 70%),
    radial-gradient(50% 60% at 10% 90%, var(--accent-soft), transparent 70%),
    linear-gradient(180deg, var(--primary-soft), var(--bg));
  overflow: hidden;
}
.hero .wrap { display: grid; grid-template-columns: 1.1fr 0.9fr; align-items: center; gap: 24px; padding-top: 56px; padding-bottom: 56px; }
.eyebrow { display: inline-block; font-size: 13px; font-weight: 700; color: var(--pink-ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin: 0 0 16px; }
.hero h1 { font-size: clamp(30px, 5.4vw, 48px); line-height: 1.3; margin: 0 0 16px; letter-spacing: .01em; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--accent) 62%); }
@media (prefers-color-scheme: dark) { .hero h1 em { background: linear-gradient(transparent 66%, rgba(232, 200, 115, 0.38) 66%); } }
.hero p.lead { font-size: 16px; color: var(--ink-soft); margin: 0 0 28px; max-width: 30em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
.chips li { font-size: 13px; color: var(--ink-soft); background: color-mix(in srgb, var(--surface) 75%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
.hero-art { position: relative; }
.hero-art img { width: 100%; max-width: 460px; margin: 0 auto; filter: drop-shadow(0 18px 30px var(--art-shadow)); }
@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: 1fr; text-align: center; padding-top: 36px; padding-bottom: 40px; }
  .hero p.lead { margin-left: auto; margin-right: auto; }
  .cta, .chips { justify-content: center; }
  .hero-art { order: -1; }
  .hero-art img { max-width: 240px; }
}

/* ── セクション ── */
section.block { padding: 64px 0; }
section.block.alt { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.head { text-align: center; margin-bottom: 32px; }
.head .kicker { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--primary-ink); margin: 0 0 4px; }
.head h2 { font-size: clamp(22px, 3.6vw, 30px); margin: 0; line-height: 1.4; }
.head p { color: var(--ink-soft); margin: 8px 0 0; font-size: 15px; }

/* スクショ */
.shots {
  display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 4px 16px 20px; margin: 0 -16px;
  scrollbar-width: thin;
}
.shots figure { margin: 0; flex: 0 0 210px; scroll-snap-align: center; }
.shots img { width: 210px; height: auto; aspect-ratio: 560 / 1217; border-radius: 22px; box-shadow: var(--shadow); background: var(--primary-soft); }
.shots figcaption { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
@media (min-width: 1000px) { .shots { justify-content: center; flex-wrap: nowrap; } .shots figure { flex-basis: 130px; } .shots img { width: 130px; } }

/* 特長 */
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 860px) { .features { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .features { grid-template-columns: 1fr; } }
.feature { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
.feature .badge { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); margin-bottom: 12px; }
.feature:nth-child(3n+2) .badge { background: var(--mint-soft); color: var(--mint-ink); }
.feature:nth-child(3n) .badge { background: var(--accent-soft); color: var(--accent-ink); }
.feature h3 { font-size: 16px; margin: 0 0 4px; }
.feature p { font-size: 14px; color: var(--ink-soft); margin: 0; }

/* よくある質問 */
.faq { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 4px 20px; }
.faq details { border-top: 1px solid var(--line); }
.faq details:first-child { border-top: 0; }
.faq summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px 0; font-weight: 700; font-size: 15px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary .ic { margin-left: auto; color: var(--ink-soft); transition: transform .2s ease; }
.faq details[open] summary .ic { transform: rotate(180deg); }
.faq details p { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }

/* お問い合わせへの案内 */
.help { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); }
.help > div { flex: 1 1 280px; }
.help h2 { margin: 0 0 4px; font-size: 20px; }
.help p { margin: 0; color: var(--ink-soft); font-size: 14px; }

/* 文書ページ */
.doc { padding: 32px 0 16px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 16px; }
.back .ic { width: 16px; height: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
.card h1 { font-size: 24px; margin: 0 0 8px; line-height: 1.4; }
.card h2 { font-size: 18px; margin: 0 0 8px; }
.card h3 { font-size: 16px; margin: 28px 0 6px; padding-top: 20px; border-top: 1px solid var(--line); }
.card p, .card li { font-size: 15px; color: var(--ink-soft); }
.card p { margin: 6px 0; }
.card p.lead { color: var(--ink); }
.card p.sub { color: var(--ink); font-weight: 700; }
.card ul { margin: 6px 0; padding-left: 1.3em; }
.meta { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
.steps { counter-reset: s; list-style: none; padding: 0 !important; }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; margin: 8px 0; }
.steps li::before { content: counter(s); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); font-size: 13px; font-weight: 700; }
.mailbox { margin-top: 16px; padding: 18px; border-radius: 16px; background: var(--primary-soft); text-align: center; }
.mailbox .btn { margin-top: 4px; }
.mailbox .addr { display: block; margin-top: 10px; font-size: 14px; color: var(--ink-soft); user-select: all; }

/* フッター */
footer.site { padding: 40px 0 48px; text-align: center; font-size: 13px; color: var(--ink-soft); }
footer.site nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin-bottom: 10px; }
footer.site a { color: var(--ink-soft); text-decoration: none; }
footer.site a:hover { color: var(--primary-ink); }
footer.site p { margin: 0; }
</style>
</head>
